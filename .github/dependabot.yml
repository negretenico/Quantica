version: 2
updates:
  # Java — marketListener
  - package-ecosystem: "maven"
    directory: "/marketListener"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    open-pull-requests-limit: 3
    groups:
      maven-listener:
        patterns: ["*"]

  # Java — markettransformer
  - package-ecosystem: "maven"
    directory: "/markettransformer"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    open-pull-requests-limit: 3
    groups:
      maven-transformer:
        patterns: ["*"]

  # Python — marketanalysis
  - package-ecosystem: "pip"
    directory: "/marketanalysis"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    open-pull-requests-limit: 3
    groups:
      pip-analysis:
        patterns: ["*"]
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pika"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Python — marketbard
  - package-ecosystem: "pip"
    directory: "/marketbard"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    open-pull-requests-limit: 3
    groups:
      pip-bard:
        patterns: ["*"]
    ignore:
      - dependency-name: "pika"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Python — markettrade
