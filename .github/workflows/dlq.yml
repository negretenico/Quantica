name: CI — Python Workers (dlq, mcp)

on:
  push:
    branches: [main]
    paths:
      - "marketdlq/**"
      - "marketmcp/**"
      - "shared/**"
  pull_request:
    paths:
      - "marketdlq/**"
      - "marketmcp/**"
      - "shared/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [marketdlq, marketmcp]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install shared
        run: pip install -e shared/

      - name: Install dependencies
        run: pip install -r ${{ matrix.module }}/requirements.txt

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: cd ${{ matrix.module }} && python -m pytest tests/ -v
