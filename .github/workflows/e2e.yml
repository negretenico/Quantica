name: E2E Tests

on:
  schedule:
    - cron: "0 6 * * *" # nightly at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Create .env for docker compose
        run: |
          cat > .env <<'EOF'
          RABBITMQ_USER=quantica
          RABBITMQ_PASS=quantica
          KAFKA_CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qg
          BINANCE_SYMBOLS=btcusdt@trade
          OPEN_AI_TOKEN=unused
          GH_TOKEN=unused
          GITHUB_REPO=negretenico/Quantica
          DISCORD_WEBHOOK_URL=
          EOF
          echo "GITHUB_TOKEN=$GITHUB_TOKEN" >> .env
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create blob directories for bind mounts
        run: mkdir -p decisions/bard decisions/trade

      - name: Start e2e stack
        run: docker compose -f docker-compose.yaml -f docker-compose.test.yaml up -d --build --remove-orphans

      - name: Wait for services healthy
        run: |
          echo "Waiting for containers to become healthy..."
          timeout 240 bash -c '
            until docker compose -f docker-compose.yaml -f docker-compose.test.yaml ps --format json \
              | python3 .github/scripts/check_health.py; do
              sleep 5
            done
          '

      - name: Install e2e test dependencies
        run: |
          pip install -e markete2e/
          pip install pytest pytest-timeout

      - name: Run e2e tests
        timeout-minutes: 5
        run: python -m pytest markete2e/tests/ -v -m e2e --timeout=300

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        working-directory: marketui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        working-directory: marketui
        timeout-minutes: 3
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml -f docker-compose.test.yaml logs --tail=200

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.test.yaml down -v --remove-orphans
