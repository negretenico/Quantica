name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "marketui/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketui/package-lock.json

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /Quantica
          NEXT_PUBLIC_DATA_BASE_URL: https://quantica-api.com
        run: cd marketui && npm ci && npm run build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: marketui/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
