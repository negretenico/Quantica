name: Market Trade Service CI/CD
permissions:
  contents: read
  packages: write
  id-token: write
on:
  push:
    paths:
      - "markettrade/**"
      - "shared/**"
      - "marketrisk/**"
    branches: [main, develop]
  pull_request:
    paths:
      - "markettrade/**"
      - "shared/**"
      - "marketrisk/**"
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.markettrade == 'true' || steps.changes.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            markettrade:
              - 'markettrade/**'
            shared:
              - 'shared/**'

  python-build:
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    uses: ./.github/workflows/reusable-python-build.yaml
    with:
      working_directory: ./markettrade
      python_version: "3.13"
      test_command: "pytest tests/"
    secrets: inherit

  prepare-docker-context:
    needs: python-build
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Download artifact from python-build
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: ./markettrade/

  docker-deploy:
    uses: ./.github/workflows/reusable-docker-build.yaml
    if: needs.check-changes.outputs.should-build == 'true'
    needs: prepare-docker-context
    with:
      working_directory: ./markettrade
      dockerfile_path: ./Dockerfile
      service_name: markettrade
      artifact_name: python-dist
      build_contexts: |
        shared=./shared
        marketrisk=./marketrisk
    secrets: inherit
