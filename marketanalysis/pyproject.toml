[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketanalysis"
version = "4.21.6.dev0"
description = "Market analysis service"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "Flask>=3.1.0",
    "numpy>=2.3.0",
    "pika>=1.3.2",
    "prometheus-client>=0.26.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
