[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketanalysis"
version = "4.21.2.dev0"
description = "Market analysis service"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "Flask==3.1.3",
    "pika==1.4.2",
    "numpy==2.3.2",
    "scikit-learn==1.9.0",
    "scipy==1.16.1",
    "python-dotenv==1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
