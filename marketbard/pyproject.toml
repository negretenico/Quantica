[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketbard"
version = "4.21.3.dev0"
description = "Market bard service"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "boto3",
    "openai>=1.0.0",
    "pika>=1.3.2",
    "prometheus-client>=0.26.0",
    "PyGithub>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
