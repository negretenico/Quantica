[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketdlq"
version = "4.21.2.dev0"
description = "DLQ monitor — logs warnings and creates GitHub issues on dead-lettered messages"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "pika==1.4.2",
    "prometheus-client==0.26.0",
    "python-dotenv==1.2.2",
    "requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
