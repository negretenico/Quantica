[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markete2e"
version = "0.1.0"
description = "E2E test helpers for publishing known events to Kafka"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "kafka-python-ng>=2.2.0",
    "pika>=1.3.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "e2e"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: marks tests that require a running Kafka broker",
]
