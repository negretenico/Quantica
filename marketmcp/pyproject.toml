[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketmcp"
version = "4.23.0.dev0"
description = "MCP server — LLM tool interface to Quantica pipeline data"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "prometheus-client>=0.26.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring a running marketserver instance",
]
