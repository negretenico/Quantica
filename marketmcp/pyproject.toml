[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketmcp"
version = "4.21.0.dev0"
description = "MCP server — LLM tool interface to Quantica pipeline data"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "prometheus-client==0.26.0",
    "python-dotenv==1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
