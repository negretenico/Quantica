[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketnotify"
version = "4.21.6.dev0"
description = "Discord notification worker for Quantica pipeline"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "pika>=1.3.2",
    "prometheus-client>=0.26.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
