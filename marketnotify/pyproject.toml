[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketnotify"
version = "4.19.0.dev0"
description = "Discord notification worker for Quantica pipeline"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "pika==1.4.2",
    "prometheus-client==0.26.0",
    "python-dotenv==1.2.2",
    "requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
