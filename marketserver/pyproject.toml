[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketserver"
version = "4.21.5.dev0"
description = "Blob HTTP server for serving JSON blobs"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "Flask>=3.1.0",
    "prometheus-flask-exporter>=0.23.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
