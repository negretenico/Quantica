[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketserver"
version = "4.20.6.dev0"
description = "Blob HTTP server for serving JSON blobs"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "Flask==3.1.3",
    "prometheus-flask-exporter==0.23.2",
    "python-dotenv==1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
