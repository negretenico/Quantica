[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markettrade"
version = "4.18.1.dev0"
description = "Market trade service"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "pika==1.4.2",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
