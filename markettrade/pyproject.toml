[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markettrade"
version = "4.21.4.dev0"
description = "Market trade service"
authors = [{name = "Nicholas Negrete", email = "negretenico0@gmail.com"}]
dependencies = [
    "pika>=1.3.2",
    "prometheus-client>=0.26.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
